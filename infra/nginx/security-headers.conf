# Security headers. nginx drops server-level add_header directives in any location that defines its
# own add_header, so this file is included in every location that serves the web app instead of once
# at server level. (/api responses get the equivalent headers from helmet in the backend.)

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS only when the original request was HTTPS (see $hsts in default.conf).
add_header Strict-Transport-Security $hsts always;
# Content-Security-Policy:
#  - scripts only from this site (no inline scripts, no eval)
#  - styles: this site + Google Fonts; 'unsafe-inline' is needed for React/Recharts style attributes
#  - media/images may come from https URLs (instructors can link external videos; seed data uses sample clips)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
