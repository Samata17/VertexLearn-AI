# API gateway / reverse proxy (PRD 9.1, 14.3): serves the React build and forwards /api to the backend.
#
# TLS: terminate HTTPS in front of this container (managed load balancer, Caddy, Traefik). This config
# trusts the X-Forwarded-Proto header from that proxy to decide whether to send HSTS.
# The container runs as a non-root user (nginx-unprivileged) and listens on 8080.

# Real client IP: when a TLS proxy / load balancer on a private network sits in front of us, take the
# client address from its X-Forwarded-For header. Requests arriving directly from public IPs can't
# spoof this (their header is ignored). Rate limits and API logs then see the real client.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Per-IP rate limit at the edge (PRD 8.9 / 9.1). The API adds finer per-user limits on top.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_req_status 429;

# Keep the original scheme when another proxy terminated TLS in front of us.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}
map $forwarded_proto $hsts {
  https   "max-age=31536000; includeSubDomains";
  default "";
}

upstream backend { server backend:4000; keepalive 16; }

server {
  listen 8080;
  server_name _;
  server_tokens off;                  # don't advertise the nginx version
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 600m;          # lecture video uploads (API limit MAX_UPLOAD_MB=500)
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Shared proxy settings for every /api location.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;

  # API responses already carry security headers from helmet in the backend, so they aren't added twice here.
  location /api/ {
    limit_req zone=api_per_ip burst=60 nodelay;
    proxy_pass http://backend;
    proxy_read_timeout 180s;          # AI requests can take a while
    proxy_request_buffering off;      # stream large uploads straight to the API
  }

  # Video/PDF streaming (HTTP Range requests): pass bytes straight through instead of
  # buffering whole files to disk inside nginx.
  location /api/v1/files/stream {
    limit_req zone=api_per_ip burst=120 nodelay;
    proxy_pass http://backend;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Backend readiness (database + Redis), used by deploy smoke tests.
  location = /health {
    access_log off;
    proxy_pass http://backend/health;
  }

  # The gateway's own liveness check (used by the container HEALTHCHECK) — does not depend on the API.
  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # Single-page app: unknown paths serve index.html so React Router can handle them.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
