
# PRD 14.2 step 1 — CI on every PR and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vertex
          POSTGRES_PASSWORD: vertex
          POSTGRES_DB: vertexlearn
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U vertex -d vertexlearn"
          --health-interval 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'

    env:
      DATABASE_URL: postgres://vertex:vertex@localhost:5432/vertexlearn
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: vertexlearn
      S3_ACCESS_KEY: vertexlearn
      S3_SECRET_KEY: vertexlearn-secret
      S3_FORCE_PATH_STYLE: 'true'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Start S3 storage (SeaweedFS)
        run: |
          docker run -d --name vertexlearn-s3 \
            -p 8333:8333 \
            chrislusf/seaweedfs:3.80 \
            server -dir=/data -s3 -s3.port=8333 \
            -master.volumeSizeLimitMB=1024 -volume.max=0

          npx --yes wait-on --timeout 60000 http://localhost:8333/healthz

      - name: Migrate + seed
        run: npm run seed

      - name: API smoke test
        env:
          SMOKE_SKIP_AI: '1'
        run: |
          npm start > api.log 2>&1 &
          npx --yes wait-on --timeout 60000 http://localhost:4000/health
          node scripts/smoke-test.mjs

      - name: API log
        if: failure()
        run: cat api.log

  ai-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  full-stack:
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate compose files
        run: |
          docker compose config --quiet
          node scripts/generate-secrets.mjs --dir ci-secrets
          SECRETS_DIR=./ci-secrets docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            --env-file .env.production.example config --quiet

      - name: Build all images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Wait for lecture indexing
        run: |
          for i in $(seq 1 60); do
            pending=$(docker compose exec -T postgres psql -U vertex vertexlearn -tAc \
              "SELECT count(*) FROM lectures WHERE ingest_status IN ('queued','processing')")
            chunks=$(docker compose exec -T postgres psql -U vertex vertexlearn -tAc \
              "SELECT count(*) FROM document_chunks")

            echo "pending=$pending chunks=$chunks"

            if [ "$pending" = "0" ] && [ "$chunks" != "0" ]; then
              exit 0
            fi

            sleep 5
          done

          echo "::error::Lecture indexing did not finish"
          exit 1

      - name: AI service reports a valid mode
        run: |
          docker compose exec -T ai-service python -c \
            "import json,urllib.request; b=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); print(b); assert b['provider']=='vertex-ai' and b['mode'] in ('live','demo')"

      - name: Full API smoke test through the gateway
        env:
          API_URL: http://localhost:8080
        run: node backend/scripts/smoke-test.mjs

      - name: Logs
        if: failure()
        run: docker compose ps && docker compose logs --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
