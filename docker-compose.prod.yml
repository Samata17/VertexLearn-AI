# VertexLearn AI — STAGING / PRODUCTION settings (PRD 14.1, 14.3).
#
#   1. node scripts/generate-secrets.mjs            creates ./secrets/* (random values, never committed)
#   2. copy .env.production.example .env.production  and fill in your domain, SMTP, etc.
#   3. docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --wait
#   4. create the first admin (see README → Deployment)
#
# Differences from development:
#   - Secrets come from files mounted as Docker secrets (/run/secrets/*), never from environment
#     variables, so they don't show up in `docker inspect` or process listings of the apps.
#   - NODE_ENV/ENVIRONMENT=production: the apps refuse to start with any development default secret.
#   - No demo data (unless SEED_DEMO_DATA=true on a staging server), no Mailpit, no debug ports:
#     only the gateway port is published. Postgres, Redis, S3 and the AI service are internal.
#   - Redis requires a password and persists to disk; SeaweedFS S3 requires access keys.
#   - Images come from the container registry (IMAGE_TAG = Git commit SHA, PRD 14.5) and have
#     memory/CPU limits, restart policies and log rotation.
#
# Managed services (PRD 14.3): to use managed PostgreSQL/Redis/S3 instead of the bundled containers,
# put their connection URLs in secrets/database_url and secrets/redis_url, set S3_ENDPOINT etc. in
# .env.production, and start only the app services:  ... up -d ai-service backend worker frontend

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

# Settings for the API and worker in production. *_FILE variables point at Docker secrets.
x-prod-app-env: &prod-app-env
  NODE_ENV: production
  APP_URL: ${APP_URL:?Set APP_URL (e.g. https://learn.example.com) in .env.production}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS (usually the same as APP_URL) in .env.production}
  SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST (your email provider) in .env.production}
  SMTP_PORT: ${SMTP_PORT:-587}
  MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env.production}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false} # never "true" in production: demo accounts share a public password
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  JWT_ACCESS_SECRET_FILE: /run/secrets/jwt_access_secret
  JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
  FILE_URL_SECRET_FILE: /run/secrets/file_url_secret
  AI_SERVICE_KEY_FILE: /run/secrets/ai_service_key
  S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
  SMTP_PASS_FILE: /run/secrets/smtp_pass

x-prod-app-secrets: &prod-app-secrets
  - database_url
  - redis_url
  - jwt_access_secret
  - jwt_refresh_secret
  - file_url_secret
  - ai_service_key
  - s3_secret_key
  - smtp_pass

services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    logging: *logging
    deploy:
      resources:
        limits: { memory: "${POSTGRES_MEMORY:-2g}" }

  redis:
    # Password-protected, append-only persistence. The password is read from the Docker secret.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
    logging: *logging
    deploy:
      resources:
        limits: { memory: "${REDIS_MEMORY:-512m}" }

  s3:
    # -s3.config enables access-key authentication (identities generated by scripts/generate-secrets.mjs).
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/run/secrets/s3_config -master.volumeSizeLimitMB=1024 -volume.max=0
    secrets: [s3_config]
    logging: *logging

  ai-service:
    image: ${REGISTRY:-vertexlearn}/vertexlearn-ai-service:${IMAGE_TAG:-latest}
    environment:
      ENVIRONMENT: production
      DATABASE_URL_FILE: /run/secrets/database_url
      # Vertex AI credentials: a service-account key in the gcp_service_account secret. Leave that file EMPTY
      # when running on Google Cloud (Cloud Run / GKE / Compute Engine): the attached service account is used.
      # No GOOGLE_CLOUD_PROJECT in .env.production = clearly-labelled demo mode.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp_service_account
      AI_SERVICE_KEY_FILE: /run/secrets/ai_service_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets: [database_url, gcp_service_account, ai_service_key, s3_secret_key]
    logging: *logging
    deploy:
      resources:
        limits: { memory: "${AI_SERVICE_MEMORY:-2g}" }

  backend:
    image: ${REGISTRY:-vertexlearn}/vertexlearn-backend:${IMAGE_TAG:-latest}
    environment: *prod-app-env
    secrets: *prod-app-secrets
    logging: *logging
    deploy:
      resources:
        limits: { memory: "${BACKEND_MEMORY:-1g}" } # uploads are buffered in memory (MAX_UPLOAD_MB)

  worker:
    image: ${REGISTRY:-vertexlearn}/vertexlearn-backend:${IMAGE_TAG:-latest}
    environment: *prod-app-env
    secrets: *prod-app-secrets
    logging: *logging
    deploy:
      resources:
        limits: { memory: "${WORKER_MEMORY:-512m}" }

  frontend:
    image: ${REGISTRY:-vertexlearn}/vertexlearn-frontend:${IMAGE_TAG:-latest}
    logging: *logging
    deploy:
      resources:
        limits: { memory: "128m" }

# Each secret is a file created by scripts/generate-secrets.mjs. Keep the folder out of Git (it is in .gitignore).
secrets:
  postgres_password: { file: "${SECRETS_DIR:-./secrets}/postgres_password" }
  database_url: { file: "${SECRETS_DIR:-./secrets}/database_url" }
  redis_password: { file: "${SECRETS_DIR:-./secrets}/redis_password" }
  redis_url: { file: "${SECRETS_DIR:-./secrets}/redis_url" }
  jwt_access_secret: { file: "${SECRETS_DIR:-./secrets}/jwt_access_secret" }
  jwt_refresh_secret: { file: "${SECRETS_DIR:-./secrets}/jwt_refresh_secret" }
  file_url_secret: { file: "${SECRETS_DIR:-./secrets}/file_url_secret" }
  ai_service_key: { file: "${SECRETS_DIR:-./secrets}/ai_service_key" }
  s3_secret_key: { file: "${SECRETS_DIR:-./secrets}/s3_secret_key" }
  s3_config: { file: "${SECRETS_DIR:-./secrets}/s3_config.json" }
  smtp_pass: { file: "${SECRETS_DIR:-./secrets}/smtp_pass" }
  gcp_service_account: { file: "${SECRETS_DIR:-./secrets}/gcp_service_account.json" }
